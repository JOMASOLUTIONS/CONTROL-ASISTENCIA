<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOMA SOLUTIONS</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 20px; box-sizing: border-box; text-align: center; }
        button { width: 100%; padding: 15px; margin: 5px 0; border-radius: 8px; border: none; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-in { background: #27ae60; } .btn-out { background: #c0392b; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #video { width: 100%; border-radius: 10px; margin-top: 10px; transform: scaleX(-1); }
        .msg { font-weight: bold; margin: 10px 0; color: #27ae60; font-size: 18px; }
        .status-gps { font-size: 14px; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>ASISTENCIA JOMA</h2>
    
    <input type="password" id="pinInput" placeholder="🔢 INGRESA TU PIN" maxlength="4" inputmode="numeric">
    <div id="nombreUsuario" class="msg"></div>
    
    <p id="gpsStatus" class="status-gps">🛰️ Buscando GPS...</p>
    
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <button id="btnIn" class="btn-in" onclick="registrar('ENTRADA')" disabled>MARCAR ENTRADA</button>
    <button id="btnOut" class="btn-out" onclick="registrar('SALIDA')" disabled>MARCAR SALIDA</button>
    
    <button onclick="location.reload()" style="background:#7f8c8d; margin-top:15px; height:40px;">🔄 Limpiar Pantalla</button>
</div>

<script>
    const URL_GAS = "https://script.google.com/macros/s/AKfycbzm4Lo9H5sDQuM-M5f-4KQjWXXYxn2vkGyMjx9_E2YEqii0UlCr5CZplg9CziHbk2fD9A/exec";
    let db = { trabajadores: [], obras: [] }, lat = 0, lon = 0, user = null, gpsOk = false;

    // Inicializar cámara y datos
    async function init() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById('video').srcObject = stream;
        
        const res = await fetch(URL_GAS);
        db = await res.json();

        navigator.geolocation.watchPosition(p => {
            lat = p.coords.latitude; lon = p.coords.longitude;
            validar();
        }, null, {enableHighAccuracy: true});
    }

    // Validar PIN
    document.getElementById("pinInput").addEventListener("input", e => {
        if (e.target.value.length === 4) {
            const f = db.trabajadores.find(t => String(t.pin) === e.target.value);
            if (f) {
                user = f.nombre;
                document.getElementById("nombreUsuario").innerText = "👤 " + user;
                e.target.disabled = true;
                validar();
            } else {
                alert("PIN no válido");
                e.target.value = "";
            }
        }
    });

    function validar() {
        if (!db.obras.length) return;
        const obra = db.obras.find(o => {
            const d = Math.sqrt((lat-o.lat)**2 + (lon-o.long)**2) * 111320;
            return d <= o.radio;
        });

        const status = document.getElementById("gpsStatus");
        if (obra) {
            status.innerText = "📍 Ubicación: " + obra.nombre;
            status.style.color = "green";
            gpsOk = true;
        } else {
            status.innerText = "❌ Fuera de rango de obra";
            status.style.color = "red";
            gpsOk = false;
        }

        document.getElementById("btnIn").disabled = !(gpsOk && user);
        document.getElementById("btnOut").disabled = !(gpsOk && user);
    }

    async function registrar(tipo) {
        document.getElementById("btnIn").disabled = true;
        document.getElementById("btnOut").disabled = true;

        const canvas = document.getElementById('canvas');
        const video = document.getElementById('video');
        canvas.width = 640; canvas.height = 480;
        canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
        const foto = canvas.toDataURL('image/jpeg', 0.5);

        const payload = { trabajador: user, tipo: tipo, lat: lat, long: lon, foto: foto, obra: document.getElementById("gpsStatus").innerText.replace("📍 Ubicación: ", ""), tipoAcceso: 'AUTO' };
        
        await fetch(URL_GAS, { method: "POST", mode: 'no-cors', body: JSON.stringify(payload) });
        alert("✅ Registro guardado");
        location.reload();
    }

    init();
</script>
</body>
</html>
