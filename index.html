<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOMA SOLUTIONS - Asistencia</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 15px; text-align: center; background: #f4f7f6; max-width: 500px; margin: auto; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #ccc; font-size: 18px; box-sizing: border-box; }
        button { color: white; font-weight: bold; border: none; cursor: pointer; height: 60px; transition: 0.3s; }
        .btn-in { background: #27ae60; } .btn-out { background: #c0392b; }
        button:disabled { background: #bdc3c7 !important; cursor: not-allowed; }
        #video { width: 100%; border-radius: 10px; background: #000; transform: scaleX(-1); border: 2px solid #34495e; }
        .hidden { display: none !important; }
        .status { font-weight: bold; margin: 10px 0; padding: 10px; border-radius: 8px; background: #eee; min-height: 40px; }
        .welcome-msg { color: #27ae60; font-weight: bold; font-size: 22px; margin: 10px 0; }
        #userPin { border: 2px solid #3498db; text-align: center; font-size: 26px; }
    </style>
</head>
<body>

<div class="container" id="main-content">
    <h2>ASISTENCIA JOMA</h2>
    
    <div id="main-ui">
        <input type="password" id="userPin" placeholder="🔢 INGRESA TU PIN" maxlength="4" inputmode="numeric">
        <div id="nombreDetectado" class="welcome-msg"></div>

        <p id="status" class="status">🛰️ Buscando señal GPS...</p>
        <select id="obraUsuario" disabled><option>Esperando ubicación...</option></select>

        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" style="display:none;"></canvas>

        <button id="btnIn" class="btn-in" onclick="prepararEnvio('ENTRADA')" disabled>🟢 MARCAR INGRESO</button>
        <button id="btnOut" class="btn-out" onclick="prepararEnvio('SALIDA')" disabled>🔴 MARCAR SALIDA</button>
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button onclick="location.reload()" style="background:#7f8c8d; flex: 1; height: 45px; font-size: 14px;">🔄 Limpiar</button>
            <button onclick="mostrarAdmin()" style="background:#34495e; flex: 1; height: 45px; font-size: 14px;">⚙️ Admin</button>
        </div>
    </div>

    <div id="admin-ui" class="hidden">
        <h3 style="color:#e67e22;">MODO MANUAL (ADMIN)</h3>
        <select id="obraAdmin"></select>
        <input type="datetime-local" id="manualTime">
        <button class="btn-in" onclick="prepararEnvio('ENTRADA', 'ADMIN')">REGISTRAR ENTRADA</button>
        <button class="btn-out" onclick="prepararEnvio('SALIDA', 'ADMIN')">REGISTRAR SALIDA</button>
        <button onclick="location.reload()" style="background:#7f8c8d;">VOLVER</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzm4Lo9H5sDQuM-M5f-4KQjWXXYxn2vkGyMjx9_E2YEqii0UlCr5CZplg9CziHbk2fD9A/exec";
    let datosLocales = { trabajadores: [], obras: [] }, geoLat = 0, geoLong = 0, empleadoActual = null;

    async function iniciar() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('video').srcObject = stream;
        } catch(e) { console.log("Cámara no disponible"); }

        navigator.geolocation.watchPosition(p => { 
            geoLat = p.coords.latitude; 
            geoLong = p.coords.longitude; 
            validarEstado(); 
        }, null, {enableHighAccuracy:true});

        const res = await fetch(API_URL);
        datosLocales = await res.json();
    }

    document.getElementById("userPin").addEventListener("input", function(e) {
        if (e.target.value.length === 4) {
            const trabajador = datosLocales.trabajadores.find(t => String(t.pin) === e.target.value);
            if (trabajador) {
                empleadoActual = trabajador.nombre;
                document.getElementById("nombreDetectado").innerText = "👤 Hola, " + empleadoActual;
                e.target.disabled = true;
                validarEstado();
            } else {
                alert("PIN no reconocido");
                e.target.value = "";
            }
        }
    });

    function validarEstado() {
        if (!datosLocales.obras.length) return;
        let obraCercana = null, minDist = Infinity;
        
        datosLocales.obras.forEach(o => {
            const d = Math.sqrt((geoLat - o.lat)**2 + (geoLong - o.long)**2) * 111320;
            if (d < minDist) { minDist = d; obraCercana = o; }
        });

        const status = document.getElementById("status");
        if (obraCercana && minDist <= obraCercana.radio) {
            document.getElementById("obraUsuario").innerHTML = `<option value="${obraCercana.nombre}">${obraCercana.nombre}</option>`;
            status.innerText = "📍 UBICACIÓN VALIDADA"; status.style.color = "green";
            if (empleadoActual) {
                document.getElementById("btnIn").disabled = false;
                document.getElementById("btnOut").disabled = false;
            }
        } else {
            status.innerText = "❌ FUERA DE RANGO"; status.style.color = "red";
            document.getElementById("btnIn").disabled = true;
            document.getElementById("btnOut").disabled = true;
        }
    }

    async function prepararEnvio(tipo, modo = 'AUTO') {
        let nombre = empleadoActual;
        let obra = document.getElementById("obraUsuario").value;

        if (modo === 'ADMIN') {
            nombre = prompt("Nombre completo del trabajador:");
            obra = document.getElementById("obraAdmin").value;
        }

        if (!nombre || !obra) return;

        document.getElementById("status").innerText = "⏳ Guardando...";
        
        const canvas = document.getElementById('canvas');
        const video = document.getElementById('video');
        let foto = "SIN_FOTO_ADMIN";
        
        if (modo !== 'ADMIN') {
            canvas.width = 640; canvas.height = 480;
            canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
            foto = canvas.toDataURL('image/jpeg', 0.5);
        }

        const datos = {
            trabajador: nombre,
            obra: obra,
            tipo: tipo,
            lat: geoLat,
            long: geoLong,
            tipoAcceso: modo,
            foto: foto,
            manualTime: modo === 'ADMIN' ? document.getElementById("manualTime").value : null
        };

        await fetch(API_URL, { method: "POST", mode: 'no-cors', body: JSON.stringify(datos) });
        alert("✅ Registro guardado");
        location.reload();
    }

    function mostrarAdmin() {
        const pass = prompt("PIN de Administrador:");
        if (["012021", "0516"].includes(pass)) {
            document.getElementById("main-ui").classList.add("hidden");
            document.getElementById("admin-ui").classList.remove("hidden");
            document.getElementById("obraAdmin").innerHTML = datosLocales.obras.map(o => `<option value="${o.nombre}">${o.nombre}</option>`).join('');
        } else { alert("PIN Incorrecto"); }
    }

    iniciar();
</script>
</body>
</html>
