<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOMA SOLUTIONS - Acceso PIN</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 15px; text-align: center; background: #f4f7f6; max-width: 500px; margin: auto; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #ccc; font-size: 18px; box-sizing: border-box; }
        button { color: white; font-weight: bold; border: none; cursor: pointer; height: 60px; }
        .btn-in { background: #27ae60; } .btn-out { background: #c0392b; }
        #video { width: 100%; border-radius: 10px; background: #000; transform: scaleX(-1); border: 3px solid #34495e; }
        .hidden { display: none !important; }
        .status { font-weight: bold; margin: 10px 0; padding: 10px; border-radius: 8px; background: #eee; min-height: 40px; }
        #access-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        .welcome-msg { color: #27ae60; font-weight: bold; font-size: 22px; margin: 10px 0; min-height: 30px; }
    </style>
</head>
<body>

<div id="access-screen">
    <h1>JOMA SOLUTIONS</h1>
    <p>PIN de acceso App:</p>
    <input type="password" id="appPin" style="width:180px; text-align:center; font-size:30px;" inputmode="numeric">
    <button onclick="validarApp()" style="width:200px; background:#27ae60;">INGRESAR</button>
</div>

<div class="container hidden" id="main-content">
    <h2>ASISTENCIA</h2>
    
    <div id="main-ui">
        <input type="password" id="userPin" placeholder="🔢 PIN DE 4 DÍGITOS" maxlength="4" inputmode="numeric" style="text-align:center; border: 2px solid #3498db; font-size: 26px;">
        <div id="nombreDetectado" class="welcome-msg"></div>

        <p id="status" class="status">🛰️ Buscando señal GPS...</p>
        <select id="obraUsuario" disabled><option>Calculando ubicación...</option></select>

        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" style="display:none;"></canvas>

        <button id="btnIn" class="btn-in" onclick="prepararEnvio('ENTRADA')" disabled>🟢 INGRESO</button>
        <button id="btnOut" class="btn-out" onclick="prepararEnvio('SALIDA')" disabled>🔴 SALIDA</button>
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button onclick="location.reload()" style="background:#7f8c8d; flex: 1; height: 45px; font-size: 14px;">Limpiar</button>
            <button onclick="mostrarAdmin()" style="background:#34495e; flex: 1; height: 45px; font-size: 14px;">⚙️ Admin</button>
        </div>
    </div>

    <div id="admin-ui" class="hidden">
        <h3 style="color:#e67e22;">MODO MANUAL</h3>
        <select id="obraAdmin"></select>
        <input type="datetime-local" id="manualTime">
        <button class="btn-in" onclick="prepararEnvio('ENTRADA', 'ADMIN')">MARCAR ENTRADA</button>
        <button class="btn-out" onclick="prepararEnvio('SALIDA', 'ADMIN')">MARCAR SALIDA</button>
        <button onclick="location.reload()" style="background:#7f8c8d;">VOLVER</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzm4Lo9H5sDQuM-M5f-4KQjWXXYxn2vkGyMjx9_E2YEqii0UlCr5CZplg9CziHbk2fD9A/exec";
    let datosLocales = { trabajadores: [], obras: [] }, geoLat = 0, geoLong = 0, empleadoActual = null;

    function validarApp() {
        if (document.getElementById("appPin").value === "2024") {
            document.getElementById("access-screen").classList.add("hidden");
            document.getElementById("main-content").classList.remove("hidden");
            iniciar();
        } else alert("PIN incorrecto");
    }

    function iniciar() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }).then(s => document.getElementById('video').srcObject = s);
        navigator.geolocation.watchPosition(p => { geoLat = p.coords.latitude; geoLong = p.coords.longitude; checkObra(); }, null, {enableHighAccuracy:true});
        fetch(API_URL).then(r => r.json()).then(res => { datosLocales = res; });
    }

    document.getElementById("userPin").addEventListener("input", function(e) {
        const pin = e.target.value;
        if (pin.length === 4) {
            const found = datosLocales.trabajadores.find(t => t.pin === pin);
            if (found) {
                empleadoActual = found.nombre;
                document.getElementById("nombreDetectado").innerText = "👤 Hola, " + empleadoActual;
                checkObra();
            } else {
                alert("PIN no registrado");
                e.target.value = "";
            }
        }
    });

    function checkObra() {
        if (!datosLocales.obras.length || !empleadoActual) return;
        let masCercana = null, minDist = Infinity;
        datosLocales.obras.forEach(o => {
            const d = calcD(geoLat, geoLong, o.lat, o.long);
            if (d < minDist) { minDist = d; masCercana = o; }
        });
        const status = document.getElementById("status"), oUser = document.getElementById("obraUsuario");
        if (masCercana && minDist <= masCercana.radio) {
            oUser.innerHTML = `<option value="${masCercana.nombre}">${masCercana.nombre}</option>`;
            status.innerText = "📍 UBICACIÓN VALIDADA"; status.style.color = "green";
            document.getElementById("btnIn").disabled = false; document.getElementById("btnOut").disabled = false;
        } else {
            status.innerText = "❌ FUERA DE RANGO"; status.style.color = "red";
            document.getElementById("btnIn").disabled = true; document.getElementById("btnOut").disabled = true;
        }
    }

    function calcD(l1, n1, l2, n2) {
        const R = 6371000, a = Math.sin(((l2-l1)*Math.PI/180)/2)**2 + Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(((n2-n1)*Math.PI/180)/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function prepararEnvio(tipo, acceso = 'AUTO') {
        const obra = acceso === 'ADMIN' ? document.getElementById("obraAdmin").value : document.getElementById("obraUsuario").value;
        const nombre = acceso === 'ADMIN' ? prompt("Confirmar nombre:") : empleadoActual;
        if (!nombre || !obra) return;

        document.getElementById("status").innerText = "⏳ Procesando...";
        try {
            const res = await fetch(`${API_URL}?nombre=${encodeURIComponent(nombre)}&check=true`);
            const val = await res.json();
            if (acceso !== 'ADMIN' && val.ultimoTipo === tipo) {
                alert("⚠️ Acción ya registrada anteriormente.");
                location.reload(); return;
            }
            enviar(tipo, nombre, obra, acceso);
        } catch (e) { enviar(tipo, nombre, obra, acceso); }
    }

    function enviar(tipo, nombre, obra, acceso) {
        document.getElementById("btnIn").disabled = true; document.getElementById("btnOut").disabled = true;
        let foto = "SIN_FOTO_ADMIN";
        if (acceso !== 'ADMIN') {
            const c = document.getElementById('canvas'), v = document.getElementById('video');
            c.width = 640; c.height = 480;
            c.getContext('2d').drawImage(v, 0, 0, 640, 480);
            foto = c.toDataURL('image/jpeg', 0.5);
        }
        fetch(API_URL, { method: "POST", mode: 'no-cors', body: JSON.stringify({ trabajador: nombre, obra: obra, tipo: tipo, lat: geoLat, long: geoLong, tipoAcceso: acceso, foto: foto, manualTime: acceso === 'ADMIN' ? document.getElementById("manualTime").value : null }) })
        .then(() => { alert("✅ Registro Guardado"); location.reload(); });
    }

    function mostrarAdmin() {
        if (["012021", "0516"].includes(prompt("PIN Admin:"))) {
            document.getElementById("main-ui").classList.add("hidden");
            document.getElementById("admin-ui").classList.remove("hidden");
            document.getElementById("obraAdmin").innerHTML = datosLocales.obras.map(o => `<option value="${o.nombre}">${o.nombre}</option>`).join('');
        }
    }
</script>
</body>
</html>
