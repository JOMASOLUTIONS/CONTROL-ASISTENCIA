<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOMA SOLUTIONS - Control Total</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 15px; text-align: center; background: #f4f7f6; max-width: 500px; margin: auto; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #ccc; font-size: 18px; box-sizing: border-box; }
        button { color: white; font-weight: bold; border: none; cursor: pointer; height: 60px; transition: 0.3s; }
        .btn-in { background: #27ae60; } .btn-out { background: #c0392b; }
        button:disabled { background: #bdc3c7 !important; cursor: not-allowed; }
        #video { width: 100%; border-radius: 10px; background: #000; transform: scaleX(-1); border: 2px solid #34495e; }
        .hidden { display: none !important; }
        .status { font-weight: bold; margin: 10px 0; padding: 10px; border-radius: 8px; background: #eee; min-height: 40px; }
        .welcome-msg { color: #27ae60; font-weight: bold; font-size: 22px; margin: 10px 0; min-height: 30px; }
    </style>
</head>
<body>

<div class="container" id="main-content">
    <h2 id="titulo">ASISTENCIA JOMA</h2>
    
    <div id="main-ui">
        <input type="password" id="userPin" placeholder="🔢 PIN TRABAJADOR" maxlength="4" inputmode="numeric" style="text-align:center; font-size:26px; border:2px solid #3498db;">
        <div id="nombreDetectado" class="welcome-msg"></div>
        <p id="status" class="status">🛰️ Buscando GPS...</p>
        <select id="obraUsuario" disabled><option value="">Esperando validación...</option></select>
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <button id="btnIn" class="btn-in" onclick="validarYEnviar('ENTRADA')" disabled>🟢 INGRESO</button>
        <button id="btnOut" class="btn-out" onclick="validarYEnviar('SALIDA')" disabled>🔴 SALIDA</button>
    </div>

    <div id="admin-ui" class="hidden">
        <h3 style="color:#e67e22;">REGISTRO MANUAL</h3>
        <select id="trabajadorAdmin"></select>
        <select id="obraAdmin"></select>
        <input type="datetime-local" id="manualTime">
        <button class="btn-in" onclick="validarYEnviar('ENTRADA', 'ADMIN')">GRABAR ENTRADA</button>
        <button class="btn-out" onclick="validarYEnviar('SALIDA', 'ADMIN')">GRABAR SALIDA</button>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button onclick="location.reload()" style="background:#7f8c8d; flex: 1; height: 45px; font-size: 14px;">🔄 Limpiar</button>
        <button onclick="mostrarAdmin()" style="background:#34495e; flex: 1; height: 45px; font-size: 14px;">⚙️ Admin</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzm4Lo9H5sDQuM-M5f-4KQjWXXYxn2vkGyMjx9_E2YEqii0UlCr5CZplg9CziHbk2fD9A/exec";
    let db = { trabajadores: [], obras: [] }, lat = 0, lon = 0, user = null;

    async function iniciar() {
        try {
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('video').srcObject = s;
        } catch(e) {}

        navigator.geolocation.watchPosition(p => { 
            lat = p.coords.latitude; lon = p.coords.longitude; 
            actualizarGPS(); 
        }, null, {enableHighAccuracy:true});

        const r = await fetch(API_URL);
        db = await r.json();
    }

    document.getElementById("userPin").addEventListener("input", function(e) {
        if (e.target.value.length === 4) {
            const t = db.trabajadores.find(x => String(x.pin) === e.target.value);
            if (t) {
                user = t.nombre;
                document.getElementById("nombreDetectado").innerText = "👤 " + user;
                e.target.disabled = true;
                actualizarGPS();
            } else { alert("PIN Incorrecto"); e.target.value = ""; }
        }
    });

    function actualizarGPS() {
        if (!db.obras.length) return;
        let cercana = null, minDist = Infinity;
        db.obras.forEach(o => {
            const d = Math.sqrt((lat - o.lat)**2 + (lon - o.long)**2) * 111320;
            if (d < minDist) { minDist = d; cercana = o; }
        });

        const st = document.getElementById("status");
        const sel = document.getElementById("obraUsuario");

        if (cercana && minDist <= cercana.radio) {
            sel.innerHTML = `<option value="${cercana.nombre}">${cercana.nombre}</option>`;
            st.innerText = "📍 EN OBRA: " + cercana.nombre; st.style.color = "green";
            if (user) { document.getElementById("btnIn").disabled = false; document.getElementById("btnOut").disabled = false; }
        } else {
            st.innerText = "❌ FUERA DE RANGO"; st.style.color = "red";
            sel.innerHTML = `<option value="">Fuera de zona</option>`;
            document.getElementById("btnIn").disabled = true; document.getElementById("btnOut").disabled = true;
        }
    }
async function validarYEnviar(tipoBoton, modo = 'AUTO') {
    const btnIn = document.getElementById("btnIn");
    const btnOut = document.getElementById("btnOut");
    const statusLabel = document.getElementById("status");

    const nombre = (modo === 'ADMIN') ? document.getElementById("trabajadorAdmin").value : user;
    const campoObra = (modo === 'ADMIN') ? document.getElementById("obraAdmin") : document.getElementById("obraUsuario");
    const obra = campoObra.value;

    if (!nombre || !obra) return alert("Faltan datos");

    // --- BLOQUEO FÍSICO DE BOTONES ---
    btnIn.disabled = true;
    btnOut.disabled = true;
    btnIn.style.opacity = "0.5";
    btnOut.style.opacity = "0.5";
    btnIn.innerText = "⌛ PROCESANDO...";
    btnOut.innerText = "⌛ PROCESANDO...";
    statusLabel.innerText = "⏳ Verificando duplicados...";
    
    try {
        // Consultamos el último registro real en el Excel
        const response = await fetch(`${API_URL}?nombre=${encodeURIComponent(nombre)}&check=true`);
        const data = await response.json();
        
        const tipoAValidar = (tipoBoton === 'ENTRADA' ? 'INGRESO' : 'SALIDA');

        if (data.ultimoTipo === tipoAValidar) {
            alert(`🛑 REGISTRO DUPLICADO: ${nombre} ya marcó ${tipoAValidar}.`);
            location.reload(); 
            return;
        }
        
        // Si todo está bien, enviamos
        await enviar(tipoBoton, nombre, obra, modo);

    } catch (e) {
        alert("Error de red. Reintentando...");
        location.reload();
    }
}
    async function enviar(tipo, nombre, obra, modo) {
        const statusLabel = document.getElementById("status");
        statusLabel.innerText = "⏳ Sincronizando registro seguro...";
        // ESPERA ALEATORIA (entre 1 y 4 segundos) para que las peticiones no choquen
        const delay = Math.floor(Math.random() * (4000 - 1000 + 1) + 1000);
        await new Promise(resolve => setTimeout(resolve, delay));
        const canvas = document.getElementById('canvas');
        const video = document.getElementById('video');
        let foto = "REGISTRO_ADMIN";
       // ... dentro de function enviar(tipo, nombre, obra, modo) ...

    if (modo !== 'ADMIN') {
        // Reducimos el tamaño del lienzo de 640x480 a 320x240
        canvas.width = 320; canvas.height = 240; 
        
        // Dibujamos la imagen en el lienzo más pequeño
        canvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
        
        // Bajamos la calidad de 0.5 (50%) a 0.1 (10%)
        foto = canvas.toDataURL('image/jpeg', 0.1); 
    }
    
    // ... resto de la función enviar ...
        const payload = {
            trabajador: nombre,
            obra: obra,
            tipo: tipo,
            lat: lat,
            long: lon,
            tipoAcceso: modo,
            foto: foto,
            manualTime: modo === 'ADMIN' ? document.getElementById("manualTime").value : null
        };
        try {
            await fetch(API_URL, { method: "POST", mode: 'no-cors', body: JSON.stringify(payload) });
            alert("✅ Registro guardado para " + nombre);
            location.reload();
        } catch (e) {
            alert("Error al enviar. Por favor, reintenta.");
            location.reload();
        }
    }
     
    function mostrarAdmin() {
        const pass = prompt("Clave Admin:");
        if (["012021", "0516"].includes(pass)) {
            document.getElementById("main-ui").classList.add("hidden");
            document.getElementById("admin-ui").classList.remove("hidden");
            document.getElementById("trabajadorAdmin").innerHTML = db.trabajadores.map(t => `<option value="${t.nombre}">${t.nombre}</option>`).join('');
            document.getElementById("obraAdmin").innerHTML = db.obras.map(o => `<option value="${o.nombre}">${o.nombre}</option>`).join('');
        } else alert("Acceso denegado");
    }

    iniciar();
</script>
</body>
</html>
